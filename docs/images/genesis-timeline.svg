<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Circuit Heroes genesis timeline</title>
  <desc id="desc">The journey from Laksh's electronics card game at age seven to real builds, pocket hardware, and fully offline engineering AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#101b35"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb526"/>
      <stop offset="0.5" stop-color="#35d0ba"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <path d="M85 230 H1115" stroke="#223352" stroke-width="16" stroke-linecap="round"/>
  <path d="M85 230 H1115" stroke="url(#line)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="600" y="54" fill="#f5f8ff" font-size="28" font-weight="700">FROM A CARD GAME TO LOCAL ENGINEERING AI</text>
    <text x="600" y="84" fill="#9fb0ce" font-size="16">One learning idea, carried from paper into silicon</text>

    <g transform="translate(110 230)">
      <circle r="28" fill="#111d33" stroke="#ffb526" stroke-width="5"/>
      <rect x="-11" y="-15" width="22" height="30" rx="3" fill="none" stroke="#ffce66" stroke-width="3"/>
      <path d="M-6 -7 H6 M-6 0 H6 M-6 7 H3" stroke="#ffce66" stroke-width="2"/>
      <text y="-72" fill="#ffce66" font-size="17" font-weight="700">AGE SEVEN</text>
      <text y="69" fill="#ffffff" font-size="18" font-weight="700">Circuit Heroes cards</text>
      <text y="94" fill="#aab8d1" font-size="14">real components become play</text>
    </g>

    <g transform="translate(355 230)">
      <circle r="28" fill="#111d33" stroke="#67dfc9" stroke-width="5"/>
      <path d="M-14 10 L0 -14 L14 10 Z M0 -5 V4 M0 9 V10" fill="none" stroke="#8df3df" stroke-width="3" stroke-linecap="round"/>
      <text y="-72" fill="#8df3df" font-size="17" font-weight="700">FIRST SHOWCASE</text>
      <text y="69" fill="#ffffff" font-size="18" font-weight="700">Kids Business Carnival</text>
      <text y="94" fill="#aab8d1" font-size="14">the idea meets its first players</text>
    </g>

    <g transform="translate(600 230)">
      <circle r="28" fill="#111d33" stroke="#35d0ba" stroke-width="5"/>
      <path d="M-14 -5 H14 M-8 -12 V13 M0 -12 V13 M8 -12 V13" stroke="#79ead8" stroke-width="3" stroke-linecap="round"/>
      <text y="-72" fill="#79ead8" font-size="17" font-weight="700">LEARN + BUILD</text>
      <text y="69" fill="#ffffff" font-size="18" font-weight="700">Games and real projects</text>
      <text y="94" fill="#aab8d1" font-size="14">circuit thinking becomes hardware</text>
    </g>

    <g transform="translate(845 230)">
      <circle r="28" fill="#111d33" stroke="#4bbbea" stroke-width="5"/>
      <rect x="-14" y="-13" width="28" height="26" rx="4" fill="none" stroke="#85d9fa" stroke-width="3"/>
      <path d="M-20 -7 H-14 M-20 0 H-14 M-20 7 H-14 M14 -7 H20 M14 0 H20 M14 7 H20" stroke="#85d9fa" stroke-width="2"/>
      <text y="-72" fill="#85d9fa" font-size="17" font-weight="700">POCKET HARDWARE</text>
      <text y="69" fill="#ffffff" font-size="18" font-weight="700">ESP32-S3</text>
      <text y="94" fill="#aab8d1" font-size="14">the lesson moves onto the device</text>
    </g>

    <g transform="translate(1090 230)">
      <circle r="28" fill="#111d33" stroke="#58a6ff" stroke-width="5" filter="url(#glow)"/>
      <path d="M-13 0 H13 M0 -13 V13 M-9 -9 L9 9 M9 -9 L-9 9" stroke="#9bcbff" stroke-width="2.4" stroke-linecap="round"/>
      <text y="-72" fill="#9bcbff" font-size="17" font-weight="700">circuitheroesLM</text>
      <text y="69" fill="#ffffff" font-size="18" font-weight="700">Fully offline AI</text>
      <text y="94" fill="#aab8d1" font-size="14">open engineering intelligence</text>
    </g>

    <text x="600" y="380" fill="#7f91b2" font-size="14">PHYSICAL CARDS  →  CIRCUIT THINKING  →  REAL BUILDS  →  EMBEDDED MODEL</text>
  </g>
</svg>
