<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">PBL terminal product workflow</title>
  <desc id="desc">A terminal dashboard connects hardware configuration, test selection, board detection, build, upload, display, touch and voice validation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06131d"/><stop offset="1" stop-color="#102b36"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="680" rx="32" fill="#071018"/>
  <rect x="55" y="48" width="1090" height="584" rx="24" fill="url(#bg)" stroke="#28d7b5" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="92" cy="82" r="8" fill="#ff625f"/><circle cx="118" cy="82" r="8" fill="#ffbd44"/><circle cx="144" cy="82" r="8" fill="#37c951"/>
  <text x="600" y="91" text-anchor="middle" font-family="ui-monospace,monospace" font-size="23" font-weight="700" fill="#eafcff">PBL · POCKET BOARD LAB</text>
  <text x="600" y="132" text-anchor="middle" font-family="ui-monospace,monospace" font-size="16" fill="#8fb8c7">CircuitHeroesLM hardware and local-AI console</text>
  <g font-family="ui-monospace,monospace">
    <rect x="92" y="174" width="310" height="128" rx="18" fill="#102f3b" stroke="#397184"/>
    <text x="118" y="208" font-size="14" fill="#64e7cc">01 · CONFIGURE</text><text x="118" y="245" font-size="20" font-weight="700" fill="white">Board + peripherals</text><text x="118" y="274" font-size="14" fill="#a7c4ce">display · touch · mic · audio</text>
    <rect x="445" y="174" width="310" height="128" rx="18" fill="#102f3b" stroke="#397184"/>
    <text x="471" y="208" font-size="14" fill="#64e7cc">02 · SELECT</text><text x="471" y="245" font-size="20" font-weight="700" fill="white">12 focused tests</text><text x="471" y="274" font-size="14" fill="#a7c4ce">AI · screen · voice · memory</text>
    <rect x="798" y="174" width="310" height="128" rx="18" fill="#102f3b" stroke="#397184"/>
    <text x="824" y="208" font-size="14" fill="#64e7cc">03 · DETECT</text><text x="824" y="245" font-size="20" font-weight="700" fill="white">Connected board</text><text x="824" y="274" font-size="14" fill="#a7c4ce">automatic serial port discovery</text>
    <path d="M402 238h43M755 238h43" stroke="#2bd5b3" stroke-width="4" stroke-linecap="round"/>
    <rect x="150" y="350" width="900" height="86" rx="18" fill="#163d48" stroke="#2bd5b3" stroke-width="2"/>
    <text x="190" y="385" font-size="15" fill="#64e7cc">ONE PRODUCT COMMAND</text><text x="190" y="417" font-size="25" font-weight="700" fill="white">pbl run  →  build  →  upload  →  monitor</text>
    <path d="M600 436v44" stroke="#2bd5b3" stroke-width="4"/>
    <rect x="214" y="480" width="772" height="102" rx="18" fill="#09191f" stroke="#397184"/>
    <text x="250" y="518" font-size="15" fill="#64e7cc">ON THE ESP32-S3</text><text x="250" y="552" font-size="20" font-weight="700" fill="white">AMOLED  ·  TOUCH  ·  MICROPHONE  ·  SPEAKER  ·  LOCAL AI</text>
  </g>
</svg>
